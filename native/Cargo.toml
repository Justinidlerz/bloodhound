[package]
name = "bloodhound_core"
version = "0.1.1"
edition = "2024"
rust-version = "1.97"
license = "MIT"
[lib]
crate-type = ["cdylib"]
[dependencies]
napi = { version = "=3.14.2", features = ["napi8", "serde-json"] }
napi-derive = "=3.6.12"
oxc_allocator = "=0.154.0"
oxc_ast = "=0.154.0"
oxc_ast_visit = "=0.154.0"
oxc_parser = "=0.154.0"
oxc_semantic = "=0.154.0"
oxc_span = "=0.154.0"
oxc_syntax = "=0.154.0"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
reqwest = { version = "0.12", default-features = false, features = ["blocking", "rustls-tls", "gzip", "brotli", "deflate"] }
url = { version = "2", features = ["serde"] }
sha2 = "0.10"
html5gum = "=0.8.4"
cssparser = "=0.38.0"
sourcemap = "=9.3.2"
jsonschema = { version = "=0.59.0", default-features = false }
base64 = "0.22"
time = { version = "0.3", features = ["formatting"] }
[build-dependencies]
napi-build = "2"
